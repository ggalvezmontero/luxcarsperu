<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Toyota Logo -->
  <defs>
    <style>
      .toyota-red { fill: #EB0A1E; }
    </style>
  </defs>
  
  <!-- Outer ellipse -->
  <ellipse cx="64" cy="64" rx="50" ry="32" fill="none" stroke="#EB0A1E" stroke-width="5"/>
  
  <!-- Horizontal inner ellipse -->
  <ellipse cx="64" cy="64" rx="32" ry="19" fill="none" stroke="#EB0A1E" stroke-width="5"/>
  
  <!-- Vertical inner ellipse -->
  <ellipse cx="64" cy="64" rx="19" ry="32" fill="none" stroke="#EB0A1E" stroke-width="5"/>
  
  <!-- Center circle -->
  <circle cx="64" cy="64" r="10" class="toyota-red"/>
</svg>
