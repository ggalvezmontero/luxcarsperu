<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- BMW Website Representation -->
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .bmw-blue { fill: #0066B1; }
      .bmw-white { fill: #FFFFFF; }
      .text { fill: #000000; font-family: Arial, sans-serif; }
      .border { fill: none; stroke: #E0E0E0; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Browser window -->
  <rect x="10" y="10" width="180" height="180" rx="8" class="bg"/>
  <rect x="10" y="10" width="180" height="180" rx="8" class="border"/>
  
  <!-- Browser header -->
  <rect x="10" y="10" width="180" height="30" rx="8" fill="#F5F5F5"/>
  <circle cx="25" cy="25" r="4" fill="#FF5F56"/>
  <circle cx="40" cy="25" r="4" fill="#FFBD2E"/>
  <circle cx="55" cy="25" r="4" fill="#27C93F"/>
  
  <!-- URL bar -->
  <rect x="70" y="18" width="110" height="14" rx="7" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="76" y="28" font-size="8" fill="#999999" font-family="Arial">bmwusa.com</text>
  
  <!-- BMW Roundel -->
  <g transform="translate(100, 80)">
    <!-- Outer black ring -->
    <circle cx="0" cy="0" r="25" fill="#000000"/>
    <circle cx="0" cy="0" r="22" fill="#FFFFFF"/>
    
    <!-- Blue and white quarters -->
    <path d="M 0,0 L 0,-22 A 22,22 0 0,1 22,0 Z" class="bmw-blue"/>
    <path d="M 0,0 L 22,0 A 22,22 0 0,1 0,22 Z" class="bmw-white"/>
    <path d="M 0,0 L 0,22 A 22,22 0 0,1 -22,0 Z" class="bmw-blue"/>
    <path d="M 0,0 L -22,0 A 22,22 0 0,1 0,-22 Z" class="bmw-white"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#000000" stroke-width="1"/>
    
    <!-- BMW text -->
    <text x="0" y="50" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000" font-family="Arial">BMW</text>
  </g>
  
  <!-- Website content -->
  <rect x="30" y="120" width="140" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="30" y="135" width="100" height="6" rx="2" fill="#E0E0E0"/>
  <rect x="30" y="145" width="120" height="6" rx="2" fill="#E0E0E0"/>
  
  <!-- CTA Button -->
  <rect x="30" y="160" width="70" height="20" rx="4" class="bmw-blue"/>
  <text x="65" y="173" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold" font-family="Arial">INVENTORY</text>
</svg>
