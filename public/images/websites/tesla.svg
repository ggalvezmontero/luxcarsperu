<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Tesla Website Representation -->
  <defs>
    <style>
      .bg { fill: #000000; }
      .text { fill: #FFFFFF; font-family: Arial, sans-serif; }
      .tesla-red { fill: #E82127; }
      .border { fill: none; stroke: #333333; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Browser window -->
  <rect x="10" y="10" width="180" height="180" rx="8" class="bg"/>
  <rect x="10" y="10" width="180" height="180" rx="8" class="border"/>
  
  <!-- Browser header -->
  <rect x="10" y="10" width="180" height="30" rx="8" fill="#1A1A1A"/>
  <circle cx="25" cy="25" r="4" fill="#FF5F56"/>
  <circle cx="40" cy="25" r="4" fill="#FFBD2E"/>
  <circle cx="55" cy="25" r="4" fill="#27C93F"/>
  
  <!-- URL bar -->
  <rect x="70" y="18" width="110" height="14" rx="7" fill="#2A2A2A" stroke="#444444" stroke-width="1"/>
  <text x="76" y="28" font-size="8" fill="#999999" font-family="Arial">tesla.com/inventory</text>
  
  <!-- Tesla T Logo -->
  <g transform="translate(100, 75)">
    <!-- T shape -->
    <path d="M -15,-20 L 15,-20 L 15,-15 L 3,-15 L 3,20 L -3,20 L -3,-15 L -15,-15 Z" fill="#E82127"/>
    
    <!-- Shield outline -->
    <path d="M -20,-25 L 20,-25 L 15,-15 L 5,25 L -5,25 L -15,-15 Z" fill="none" stroke="#E82127" stroke-width="2"/>
  </g>
  
  <!-- TESLA text -->
  <text x="100" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial" letter-spacing="4">TESLA</text>
  
  <!-- Website content -->
  <rect x="30" y="130" width="140" height="6" rx="2" fill="#333333"/>
  <rect x="30" y="142" width="100" height="5" rx="2" fill="#333333"/>
  <rect x="30" y="152" width="120" height="5" rx="2" fill="#333333"/>
  
  <!-- CTA Button -->
  <rect x="30" y="165" width="80" height="18" rx="4" fill="#FFFFFF"/>
  <text x="70" y="177" text-anchor="middle" font-size="9" fill="#000000" font-weight="bold" font-family="Arial">VIEW INVENTORY</text>
</svg>
