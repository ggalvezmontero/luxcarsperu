<html><head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
body{background:#fff;color:#000;font-family:Montserrat,sans-serif;margin:0;padding:20px}
div{white-space:nowrap;margin:10px 0}
.w400{font-weight:400}.w500{font-weight:500}.w600{font-weight:600}.w700{font-weight:700}
.big{font-size:150px;line-height:1.15}
.lab{font-family:monospace;font-size:14px;color:#888}
</style></head><body>
<p class="lab">Montserrat 400 / 500 / 600 / 700 — natural width, no stretch</p>
<div class="big w400">LUX CARS</div>
<div class="big w500">LUX CARS</div>
<div class="big w600">LUX CARS</div>
<div class="big w700">LUX CARS</div>
<p class="lab">Montserrat 500 stretched 1.6x horizontally (to mimic logo)</p>
<div class="big w500" style="transform:scaleX(1.6);transform-origin:left">LUX CARS</div>
</body></html>
