<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- LuxCars Logo - Ultra Clean -->
  <defs>
    <style>
      .logo-white { fill: #FFFFFF; }
      .logo-gray { fill: #D0D0D0; }
    </style>
  </defs>
  
  <!-- Shield/Badge Shape -->
  <path d="M 100,20 L 160,50 L 160,130 L 100,180 L 40,130 L 40,50 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4" 
        stroke-linejoin="round"/>
  
  <!-- Inner Shield -->
  <path d="M 100,35 L 150,60 L 150,125 L 100,165 L 50,125 L 50,60 Z" 
        fill="url(#shieldGradient)"/>
  
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Letter L stylized -->
  <g transform="translate(100, 100)">
    <text 
      x="0" 
      y="15" 
      text-anchor="middle" 
      font-family="Arial, sans-serif" 
      font-size="75" 
      font-weight="900" 
      fill="#FFFFFF"
      letter-spacing="-3">
      L
    </text>
  </g>
</svg>

