<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Chevrolet Bowtie Logo -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5C878;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A55A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A88B4A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bowtie shape (cross/plus shape) -->
  <g transform="translate(64, 64)">
    <!-- Top rectangle -->
    <polygon points="-40,-8 -15,-25 15,-25 40,-8 15,-8 -15,-8" fill="url(#goldGradient)" stroke="#8B7355" stroke-width="1"/>
    
    <!-- Right rectangle -->
    <polygon points="8,-40 25,-15 25,15 8,40 8,15 8,-15" fill="url(#goldGradient)" stroke="#8B7355" stroke-width="1"/>
    
    <!-- Bottom rectangle -->
    <polygon points="40,8 15,25 -15,25 -40,8 -15,8 15,8" fill="url(#goldGradient)" stroke="#8B7355" stroke-width="1"/>
    
    <!-- Left rectangle -->
    <polygon points="-8,40 -25,15 -25,-15 -8,-40 -8,-15 -8,15" fill="url(#goldGradient)" stroke="#8B7355" stroke-width="1"/>
  </g>
</svg>
