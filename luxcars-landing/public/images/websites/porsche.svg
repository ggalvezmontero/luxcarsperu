<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Porsche Website Representation -->
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .text { fill: #000000; font-family: Arial, sans-serif; font-weight: bold; }
      .accent { fill: #D5001C; }
      .border { fill: none; stroke: #E0E0E0; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Browser window -->
  <rect x="10" y="10" width="180" height="180" rx="8" class="bg"/>
  <rect x="10" y="10" width="180" height="180" rx="8" class="border"/>
  
  <!-- Browser header -->
  <rect x="10" y="10" width="180" height="30" rx="8" fill="#F5F5F5"/>
  <circle cx="25" cy="25" r="4" fill="#FF5F56"/>
  <circle cx="40" cy="25" r="4" fill="#FFBD2E"/>
  <circle cx="55" cy="25" r="4" fill="#27C93F"/>
  
  <!-- URL bar -->
  <rect x="70" y="18" width="110" height="14" rx="7" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="76" y="28" font-size="8" fill="#999999" font-family="Arial">porsche.com</text>
  
  <!-- Porsche Crest simplified -->
  <g transform="translate(100, 80)">
    <!-- Shield outline -->
    <path d="M 0,-25 L 20,-15 L 20,15 L 0,25 L -20,15 L -20,-15 Z" fill="#D5001C" stroke="#000000" stroke-width="2"/>
    
    <!-- Inner shield -->
    <ellipse cx="0" cy="0" rx="15" ry="18" fill="#FFFFFF"/>
    
    <!-- PORSCHE text -->
    <text x="0" y="4" text-anchor="middle" font-size="6" font-weight="bold" fill="#000000" font-family="Arial">PORSCHE</text>
  </g>
  
  <!-- Website content lines -->
  <rect x="30" y="120" width="140" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="30" y="135" width="100" height="6" rx="2" fill="#E0E0E0"/>
  <rect x="30" y="145" width="120" height="6" rx="2" fill="#E0E0E0"/>
  
  <!-- CTA Button -->
  <rect x="30" y="160" width="60" height="20" rx="4" class="accent"/>
  <text x="60" y="173" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="bold" font-family="Arial">EXPLORE</text>
</svg>
