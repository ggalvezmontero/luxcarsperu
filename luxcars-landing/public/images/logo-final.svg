<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d072"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#b68b2d"/>
    </linearGradient>
    <radialGradient id="glowGrad">
      <stop offset="0%" style="stop-color:#f5d072;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="#000000"/>
  
  <!-- Glow -->
  <circle cx="250" cy="250" r="200" fill="url(#glowGrad)"/>
  
  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.3"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Stylized Luxury Car Icon -->
  <g transform="translate(250, 220)">
    <!-- Car Body - Sleek Sports Car Silhouette -->
    <path d="M -90 0 L -70 -40 L -30 -50 L 40 -50 L 80 -35 L 95 0 L 95 25 L 85 30 L -85 30 L -90 25 Z" 
          fill="url(#goldGrad)" 
          stroke="#f5d072" 
          stroke-width="2"/>
    
    <!-- Windshield -->
    <path d="M -50 -45 L -25 -48 L 25 -48 L 45 -40 L 40 -20 L -45 -20 Z" 
          fill="#1a1a1a" 
          opacity="0.9"/>
    
    <!-- Side Window -->
    <path d="M 45 -35 L 70 -30 L 75 -15 L 45 -20 Z" 
          fill="#1a1a1a" 
          opacity="0.7"/>
    
    <!-- Front Wheel -->
    <g transform="translate(-55, 30)">
      <circle r="18" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="3"/>
      <circle r="10" fill="url(#goldGrad)"/>
      <circle r="5" fill="#0a0a0a"/>
    </g>
    
    <!-- Rear Wheel -->
    <g transform="translate(55, 30)">
      <circle r="18" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="3"/>
      <circle r="10" fill="url(#goldGrad)"/>
      <circle r="5" fill="#0a0a0a"/>
    </g>
    
    <!-- Accent Lines -->
    <line x1="-80" y1="5" x2="85" y2="5" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="-70" y1="-5" x2="75" y2="-5" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
    
    <!-- Headlight -->
    <ellipse cx="-85" cy="15" rx="4" ry="6" fill="#f5d072" opacity="0.8"/>
    
    <!-- Taillight -->
    <ellipse cx="90" cy="15" rx="3" ry="5" fill="#ff4444" opacity="0.6"/>
  </g>
  
  <!-- Brand Name -->
  <text x="250" y="340" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-size="48" 
        font-weight="700" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="8">
    LUXCARS
  </text>
  
  <!-- Tagline -->
  <text x="250" y="370" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-size="16" 
        font-weight="400" 
        fill="#f5d072" 
        text-anchor="middle" 
        letter-spacing="4"
        opacity="0.7">
    MIAMI · LIMA
  </text>
  
  <!-- Decorative Elements -->
  <line x1="150" y1="380" x2="200" y2="380" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="380" x2="350" y2="380" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  
  <!-- Corner Accents -->
  <path d="M 80 250 L 100 250 L 100 230" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 420 250 L 400 250 L 400 230" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 80 250 L 100 250 L 100 270" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 420 250 L 400 250 L 400 270" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.4"/>
</svg>

