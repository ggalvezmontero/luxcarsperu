<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0A0A0A" stroke="url(#goldGradient)" stroke-width="3"/>
  
  <!-- Gold Gradient Definition -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d072;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b68b2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d072;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stylized Car Silhouette -->
  <g transform="translate(100, 100)">
    <!-- Car Body -->
    <path d="M -45 -10 L -35 -25 L -10 -30 L 20 -30 L 40 -20 L 45 -10 L 45 10 L -45 10 Z" 
          fill="url(#goldGradient2)" stroke="#f5d072" stroke-width="1.5"/>
    
    <!-- Windshield -->
    <path d="M -25 -25 L -10 -28 L 10 -28 L 20 -25 L 15 -15 L -20 -15 Z" 
          fill="#1a1a1a" opacity="0.8"/>
    
    <!-- Wheels -->
    <circle cx="-25" cy="10" r="8" fill="#1a1a1a" stroke="url(#goldGradient)" stroke-width="2"/>
    <circle cx="25" cy="10" r="8" fill="#1a1a1a" stroke="url(#goldGradient)" stroke-width="2"/>
    <circle cx="-25" cy="10" r="4" fill="url(#goldGradient)"/>
    <circle cx="25" cy="10" r="4" fill="url(#goldGradient)"/>
    
    <!-- Accent Lines -->
    <line x1="-40" y1="0" x2="40" y2="0" stroke="url(#goldGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="-35" y1="-5" x2="35" y2="-5" stroke="url(#goldGradient)" stroke-width="0.5" opacity="0.4"/>
  </g>
  
  <!-- Letter L (Stylized) -->
  <g transform="translate(100, 140)">
    <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" 
          fill="url(#goldGradient)" text-anchor="middle" letter-spacing="3">
      LUXCARS
    </text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="40" r="2" fill="#f5d072" opacity="0.6"/>
  <circle cx="100" cy="160" r="2" fill="#f5d072" opacity="0.6"/>
</svg>

